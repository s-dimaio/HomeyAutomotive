# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# Sized for 16GB host RAM: 4096MB heap gives R8 and Kotlin compiler ample room with fast ParallelGC
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Execute independent tasks in parallel across CPU cores
org.gradle.parallel=true

# Enable Gradle Build Cache to reuse outputs between builds
org.gradle.caching=true

# Enable Gradle Configuration Cache to skip configuration phase when inputs haven't changed
org.gradle.configuration-cache=true

# Enable file system watching to immediately detect file changes
org.gradle.vfs.watch=true

# Kotlin incremental compilation
kotlin.incremental=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# AndroidX package structure ? required for AndroidX dependencies
android.useAndroidX=true
# Use Android Studio bundled JDK to avoid jlink.exe missing errors
org.gradle.java.home=C\:/Program Files/Android/Android Studio/jbr
android.uniquePackageNames=false
android.dependency.useConstraints=false
# android.dependency.excludeLibraryComponentsFromConstraints=true
android.r8.strictFullModeForKeepRules=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
